apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: tofu-controller
  namespace: flux-system
spec:
  interval: 10m
  path: ./clusters/minikube/controller
  prune: true
  wait: true
  timeout: 5m
  sourceRef:
    kind: GitRepository
    name: flux-system
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: terraform
  namespace: flux-system
spec:
  interval: 10m
  path: ./clusters/minikube/terraform
  prune: true
  dependsOn:
    - name: tofu-controller
  sourceRef:
    kind: GitRepository
    name: flux-system
